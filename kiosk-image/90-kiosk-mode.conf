# ZimaOS kiosk panel: force native 1366x768 at X start regardless of EDID timing
# (modesetting driver — no intel_drv in this image). Modeline + PreferredMode
# beat the xrandr race; enforcer in entrypoint.sh keeps watch for monitor-off drops.
Section "Monitor"
    Identifier "Panel"
    Modeline "1366x768_60" 85.25 1366 1440 1576 1792 768 771 774 798 +hsync +vsync
    Option "PreferredMode" "1366x768_60"
EndSection