<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hermes — Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ==== V3 palette — huemint brand-intersection 031216-46656c-e85404-f1d7c8 ==== */
  :root{
    --bg:#050505; --grid:#101010; --surface:#080808; --surface2:#0d0d0d; --raised:#141414;
    --teal:#262626; --cream:#fafafa; --orange:#06eaff; --orange-soft:rgba(6,234,255,.14);
    --red:#ff0140; --ink:#fafafa; --dim:#737373; --faint:rgba(250,250,250,.10);
    --ok:#06eaff; --warn:#ffb15c; --bad:#ff0140;
    --f-disp:"Chakra Petch", sans-serif; --f-body:"Inter", sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--f-body);color:var(--ink);background:var(--bg);
    display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:52px 1fr}

  /* ==== hyper-grid canvas background ==== */
  #hypergrid{position:absolute;inset:0;z-index:0;opacity:.85;pointer-events:none}
  /* ==== pihole card ==== */
  .phleft{position:absolute;left:14px;top:44px;display:flex;flex-direction:column;gap:5px}
  .phbig{font:700 34px var(--f-disp);color:var(--cream);line-height:1}
  .phsub{font:600 9px var(--f-disp);letter-spacing:.05em;color:var(--dim);text-transform:uppercase;line-height:1.5}
  #phsparkwrap{position:absolute;left:14px;right:14px;bottom:10px;top:118px;display:flex;align-items:flex-end;gap:5px}
  #phsparkwrap i{flex:0 1 20px;min-height:4px;background:linear-gradient(180deg,#06eaff,#0684d0);opacity:.8;border-radius:2px 2px 0 0}
  #phsparkwrap i:last-child{background:#06eaff;opacity:1;box-shadow:0 0 4px rgba(6,234,255,.25)}

  /* ==== avatar model dropup (bottom-right corner) ==== */
  .avdrop{position:fixed;right:4px;bottom:3px;z-index:50;font-family:var(--f-disp)}
  .avdrop #avtab{background:#0b0b0b;color:var(--cream);border:1px solid #1a1a1a;border-radius:8px;
    font:600 8px var(--f-disp);letter-spacing:.1em;padding:3px 7px;cursor:pointer;text-transform:uppercase;opacity:.65}
  .avdrop #avtab:hover{border-color:rgba(6,234,255,.5)}
  .avmenu{display:none;position:absolute;right:0;bottom:38px;background:rgba(5,5,5,.97);border:1px solid #1a1a1a;
    border-radius:10px;overflow:hidden;min-width:110px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
  .avdrop.open .avmenu{display:block}
  .avmenu button{display:block;width:100%;text-align:left;background:none;border:none;color:#cfcfcf;
    font:600 9px var(--f-disp);letter-spacing:.08em;padding:4px 10px;cursor:pointer;text-transform:uppercase}
  .avmenu button:hover{background:rgba(6,234,255,.08);color:#06eaff}
  .avmenu button.on{color:#06eaff}
  /* avatar cell */
  .avcard{perspective:none}
  .avcard .avi-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);width:170px;height:170px;pointer-events:none}
  #avatar{width:170px;height:170px}
  /* ==== pihole bars ==== */
    header,main,aside,#chatdock{position:relative;z-index:1}

  header{grid-column:1/2;display:flex;align-items:center;gap:14px;padding:0 20px;
    border-bottom:1px solid var(--faint);background:#0b0b0b;backdrop-filter:blur(4px)}
  .logo{font-family:var(--f-disp);font-size:18px;font-weight:700;letter-spacing:.06em;color:var(--cream)}
  .logo b{color:var(--orange);font-weight:700}
  .clock{margin-left:auto;font-family:var(--f-disp);font-variant-numeric:tabular-nums;font-size:20px;color:var(--dim)}
  .clock b{color:var(--cream);font-weight:500}

  /* ==== small flip cards (card-14 port) ==== */
  main{height:calc(100vh - 52px);padding:12px 16px 12px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
    display:grid;gap:10px;min-width:0;
    grid-template-columns:repeat(8,minmax(0,1fr));
    grid-template-rows:118px 180px minmax(120px, 1fr);
    grid-template-areas:
      "mem mem disk disk load load ctr ctr"
      "eco eco ph ph preqs preqs preqs preqs"
      "chat chat chat chat chat chat av av"}
  main::-webkit-scrollbar{display:none}
  main>*{min-width:0}
  .card[data-k="mem"]{grid-area:mem}
  .card[data-k="disk"]{grid-area:disk}
  .card[data-k="load"]{grid-area:load}
  .card[data-k="ctr"]{grid-area:ctr}
  .card[data-k="eco"]{grid-area:eco}
  .card[data-k="preqs"]{grid-area:preqs}
  .card[data-k="chat"]{grid-area:chat}
  .card[data-k="ph"]{grid-area:ph}
  .card[data-k="av"]{grid-area:av}

  .card{--h:110px;perspective:900px;background:transparent;border:none}
  .flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,0,0,1)}
  .card:hover .flip{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;
    border:1px solid #1a1a1a;padding:10px 12px;overflow:hidden;
    background:linear-gradient(180deg,var(--surface2),var(--surface))}
  .face.back{transform:rotateY(180deg);background:linear-gradient(180deg,var(--raised),var(--surface))}
  .face h2{font-family:var(--f-disp);font-size:10px;font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);margin-bottom:4px}
  .face .big{font-family:var(--f-disp);font-size:22px;font-weight:700;color:var(--cream);line-height:1.2;
    font-variant-numeric:tabular-nums}
  .face .sub{color:var(--cream);font-size:13px;margin-top:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .face .extra{color:var(--dim);font-size:10px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .face .big{margin-top:6px}
  .face.back .stat{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--dim);
    padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
  .face.back .stat b{color:var(--cream);font-weight:600;text-align:right}
  .face .more{position:absolute;right:10px;bottom:6px;font-size:7px;letter-spacing:.1em;color:var(--orange);
    opacity:.8}

  /* services pills (front face of nothing — service detail moved into hover card too) */
  .svc{display:flex;flex-wrap:wrap;gap:4px;font-size:8px;max-height:70px;overflow-y:auto;scrollbar-width:none}
  .svc::-webkit-scrollbar{display:none}
  .svc span{display:flex;align-items:center;gap:3px;padding:2px 6px;background:#0b0b0b;
    border:1px solid #1a1a1a;border-radius:6px;color:var(--dim)}
  .svc b{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:0 0 auto}
  .svc b.d{background:var(--bad)}
  .q{display:flex;flex-direction:column;gap:4px;font-size:9px}
  .q .it{display:flex;gap:6px;align-items:baseline;padding:4px 6px;background:#0b0b0b;
    border:1px solid #1a1a1a;border-radius:6px}
  .q .t{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q .s{color:var(--orange);font-size:7px;text-transform:uppercase;letter-spacing:.07em}
  .q .g{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pl .it{display:flex;gap:7px;align-items:center;padding:4px 6px;border:1px solid #1a1a1a;
    border-radius:6px;background:#0b0b0b}
  .pl .play{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;
    border-left:7px solid var(--orange);flex:0 0 auto}
  .pl .prog{width:100%;height:3px;background:rgba(241,215,200,.12);border-radius:2px;overflow:hidden;margin-top:2px}
  .pl .prog>i{display:block;height:100%;background:var(--orange)}
  .empty{color:var(--dim);font-size:9px;font-style:italic}

  /* ecoflow battery visuals */
  .batt{display:flex;align-items:center;gap:12px}
  .batt .bwrap{width:120px;height:56px;border:2px solid var(--teal);border-radius:8px;position:relative;padding:4px}
  .batt .bwrap::after{content:"";position:absolute;right:-7px;top:50%;transform:translateY(-50%);
    width:5px;height:20px;background:var(--teal);border-radius:0 3px 3px 0}
  .batt .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#015b66,var(--orange));
    width:var(--soc,50%);transition:width .8s}
  .batt .pct{font-family:var(--f-disp);font-size:22px;font-weight:700;color:var(--cream)}
  .batt .meta{font-size:8px;color:var(--dim);line-height:1.5}
  .batt .meta b{color:var(--orange);font-weight:600}


  /* ==== card shell (tilt only, no glare) ==== */
  .card { transform-style:preserve-3d; transition:transform .35s ease; will-change:transform; overflow:hidden; clip-path:inset(0 round 12px); }

  .preq{display:flex;flex-direction:column;gap:4px;margin-top:2px}
  .preq div{display:flex;gap:6px;align-items:baseline;font-size:12px;color:var(--cream);white-space:nowrap;overflow:hidden}
  .preq b{color:var(--cyan);font:600 9px var(--f-disp);min-width:36px}
  .preq span{color:var(--dim);overflow:hidden;text-overflow:ellipsis}

  /* ==== eco watt history bars (spring) ==== */
  .bchart{position:absolute;inset:38px 12px 8px 12px;display:flex;align-items:flex-end;gap:6px}
  .bchart i{flex:1;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--orange),rgba(6,234,255,.25));
    height:0;transition:height .9s cubic-bezier(.34,1.4,.4,1)}
  .bchart i.o{background:linear-gradient(180deg,var(--cream),rgba(241,215,200,.2))}

  .mostat{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0;color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
  #reply:empty + .mostat{display:none}

  /* ==== chat FAB ==== */
  #chatfab{position:fixed;right:16px;bottom:16px;z-index:70;width:54px;height:54px;border-radius:50%;
    border:1px solid rgba(6,234,255,.35);background:radial-gradient(circle at 35% 30%, rgba(6,234,255,.35), rgba(6,234,255,.08) 60%, transparent);
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  #chatfab::before{content:"";width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d8fdff, #06eaff 55%, #015b66)}
  body.chat-open #chatfab{display:none}
  .chatbtn{width:100%;padding:7px 10px;margin:0 0 6px;border-radius:8px;border:1px solid var(--faint);
    background:transparent;color:var(--dim);font:600 9px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  .chatbtn:hover{color:var(--cream);border-color:var(--orange)}

  .card[data-k="mem"] .big, .card[data-k="disk"] .big, .card[data-k="load"] .big{max-width:70%}

  .preq{overflow-y:auto;scrollbar-width:none}
  .preq::-webkit-scrollbar{display:none}
  .face[data-k="preqs"], .card[data-k="preqs"] .face{display:flex;flex-direction:column}
    .card[data-k="preqs"] .preq:first-of-type{flex:1 1 44%;min-height:0}
  .card[data-k="preqs"] .preq:last-of-type{flex:1 1 36%;min-height:0}

  /* ==== chat card ==== */
  .chatface{display:flex;flex-direction:column}
  .chatface .chatrow{margin-top:auto;margin-bottom:2px;display:flex;gap:6px;align-items:center}
splay:flex;gap:6px;align-items:center;position:relative;z-index:6}
  .chatrow input{flex:1;min-width:0;background:#0b0b0b;border:1px solid #1a1a1a;color:#fafafa;
    border-radius:8px;padding:8px 10px;font:12px var(--f-body)}
  .chatrow .send{border-radius:8px;border:1px solid rgba(6,234,255,.4);background:rgba(6,234,255,.12);
    color:#06eaff;font:600 11px var(--f-disp);letter-spacing:.08em;padding:8px 12px;cursor:pointer}
  .dropup{position:fixed;left:auto;right:16px;bottom:96px;width:340px;max-height:320px;overflow:hidden;display:none;z-index:60;
    background:rgba(5,5,5,.97);border:1px solid #1a1a1a;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.7)}
  .dropup.open{display:block}
  .dr-msgs{max-height:320px;overflow-y:auto;padding:10px 12px;font-size:11px;line-height:1.5;color:#cfcfcf}
  .dr-msgs .d{margin-bottom:7px}
  .dr-msgs .m{color:#06eaff;font:600 8px var(--f-disp);letter-spacing:.1em;text-transform:uppercase}
  .dr-msgs .m.user{color:#fafafa}
  
  .ringw{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:56px;height:56px}
  .ringw .ring{position:absolute;inset:0;width:64px;height:64px;margin:0}
  .rpct{position:absolute;left:0;top:0;width:56px;height:56px;display:flex;align-items:center;justify-content:center;
    font:700 14px var(--f-disp);color:var(--cream)}
  .ring .rbg{fill:none;stroke:rgba(6,234,255,.10);stroke-width:4}
  .ring .rfg{fill:none;stroke:#06eaff;stroke-width:4;stroke-linecap:round;
    stroke-dasharray:119.4;stroke-dashoffset:119.4;transition:stroke-dashoffset .8s cubic-bezier(.3,1,.4,1);
    filter:drop-shadow(0 0 2px rgba(6,234,255,.25))}
  .card[data-k="mem"] .sub,.card[data-k="disk"] .sub,.card[data-k="load"] .sub{position:absolute;left:76px;top:calc(50% - 9px);max-width:calc(100% - 150px)}
  .card[data-k="mem"] .extra,.card[data-k="disk"] .extra,.card[data-k="load"] .extra{position:absolute;left:76px;top:calc(50% + 7px);max-width:calc(100% - 90px)}
  .card[data-k="mem"] .spark,.card[data-k="disk"] .spark,.card[data-k="load"] .spark{left:auto;right:10px;margin-left:0}
  .card[data-k="mem"] h2,.card[data-k="disk"] h2,.card[data-k="load"] h2{margin-left:0}
/* ==== right chat column ==== */
  aside{position:fixed;right:14px;bottom:14px;width:290px;height:430px;display:none;flex-direction:column;
    border:1px solid var(--faint);border-radius:16px;overflow:hidden;z-index:60;
    background:rgba(5,5,5,.92);backdrop-filter:blur(8px);box-shadow:0 20px 60px rgba(0,0,0,.7)}
  body.chat-open aside{display:flex}

  .avrow{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center}
  #reply{flex:1;overflow:auto;padding:8px 14px 10px;font-size:12px;line-height:1.55;color:var(--ink);
    white-space:pre-wrap;min-height:0}
  #reply .m{color:var(--dim);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;margin-top:12px}
  #reply .m:first-child{margin-top:0}

  /* chat dock with thinking orb (anark orb port: pulsing ring orb + input) */
  #chatdock{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--faint);
    background:#0b0b0b;align-items:center}
  .orb{width:30px;height:30px;border-radius:50%;flex:0 0 auto;position:relative;
    background:radial-gradient(circle at 35% 30%, rgba(255,1,64,.85), rgba(255,1,64,.15) 65%, transparent);
}
  .orb::before{content:"";position:absolute;inset:-6px;border-radius:50%;
    border:1.5px solid rgba(255,1,64,.5);animation:orbpulse 1.6s ease-out infinite}
  @keyframes orbpulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:0}}
  body.thinking .orb::after{content:"";position:absolute;inset:6px;border-radius:50%;
    background:conic-gradient(var(--orange),transparent 60%);animation:orbspin .9s linear infinite}
  @keyframes orbspin{to{transform:rotate(360deg)}}
  input#q{flex:1 1 0;background:#0b0b0b;border:1px solid #1a1a1a;color:var(--cream);
    border-radius:9px;padding:9px 11px;font-size:12px;font-family:var(--f-body);outline:none;min-width:0}
  input#q:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
  button.send{border-radius:8px;border:1px solid rgba(6,234,255,.4);background:rgba(6,234,255,.12);
    color:#06eaff;font:600 10px var(--f-disp);letter-spacing:.08em;padding:7px 10px;cursor:pointer;transition:filter .12s}
  button.send:hover{filter:brightness(1.12)}
  button.send:disabled{opacity:.4;cursor:default}
  #avatar .mouth{transform-origin:50% 60%}
  #avatar.talking .mouth{animation:talk .28s infinite alternate}
  @keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
  /* thinking: shimmer reply line */
  body.thinking #reply .think::after{content:"";display:inline-block;width:8px;height:8px;margin-left:4px;
    border-radius:50%;background:var(--orange);animation:dotblink 1s infinite alternate}
  @keyframes dotblink{from{opacity:.25}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .orb::before,body.thinking .orb::after{animation:none}
    .card:hover .flip{transform:none}
  }
</style>
</head>
<body>
<canvas id="hypergrid"></canvas>
<header>
  <div class="logo"><b>Pooh's HunLab</b> <span style="font-weight:400;color:var(--dim);font-size:12px">· kiosk v3.1</span></div>
  <div class="clock" id="clock">--:--</div>
  <div id="syncc" style="font:600 9px var(--f-disp);letter-spacing:.1em;color:var(--dim);border:1px solid #1a1a1a;border-radius:6px;padding:2px 8px;margin-right:6px;text-transform:uppercase">sync</div>
</header>

<main id="board">
  <div class="card" data-k="mem" data-h="110" style="--h:110px">
    <div class="flip">
      <div class="face front"><h2>Memory</h2><div class="ringw"><svg class="ring" viewBox="0 0 44 44" id="memring"><circle class="rbg" cx="22" cy="22" r="19"/><circle class="rfg" cx="22" cy="22" r="19"/></svg><b class="rpct" id="mempct"></b></div><div class="spark" id="memspark"></div>
        <div class="sub" id="memsub">–</div><div class="extra" id="memx">–</div></div>
      <div class="face back" id="memback"></div>
    </div>
  </div>
  <div class="card" data-k="disk" style="--h:110px">
    <div class="flip">
      <div class="face front"><h2>Storage</h2><div class="ringw"><svg class="ring" viewBox="0 0 44 44" id="diskring"><circle class="rbg" cx="22" cy="22" r="19"/><circle class="rfg" cx="22" cy="22" r="19"/></svg><b class="rpct" id="diskpct"></b></div>
        <div class="spark" id="diskspark"></div><div class="sub" id="disksub">–</div><div class="extra" id="diskx">–</div></div>
      <div class="face back" id="diskback"></div>
    </div>
  </div>
  <div class="card" data-k="load" style="--h:110px">
    <div class="flip">
      <div class="face front"><h2>CPU load</h2><div class="ringw"><svg class="ring" viewBox="0 0 44 44" id="loadring"><circle class="rbg" cx="22" cy="22" r="19"/><circle class="rfg" cx="22" cy="22" r="19"/></svg><b class="rpct" id="loadpct"></b></div>
        <div class="spark" id="loadspark"></div><div class="sub" id="loadsub">–</div><div class="extra" id="loadx">–</div></div>
      <div class="face back" id="loadback"></div>
    </div>
  </div>
  <div class="card" data-k="ctr" style="--h:110px">
    <div class="flip">
      <div class="face front"><h2>Containers</h2><div class="big" id="ctr">–</div>
        <div class="sub" id="ctrsub">docker containers</div><div class="extra" id="ctrx">–</div></div>
      <div class="face back" id="ctrback"></div>
    </div>
  </div>

  <div class="card" data-k="eco" style="--h:110px">
    <div class="face front"><h2>EcoFlow · RIVER 2 Pro</h2>
      <div class="batt">
        <div class="bwrap"><div class="fill" id="ecofill" style="--soc:0%"></div></div>
        <div>
          <div class="pct" id="ecosoc">–</div>
          <div class="meta"><b id="ecoin">▼ 0W</b> in · <b id="ecoout">▲ 0W</b> out</div>
        </div>
      </div>
      <div class="bchart" id="ecobars"></div>
    </div>
  </div>

  <div class="card" data-k="preqs" style="--h:150px">
    <div class="flip">
      <div class="face front"><h2>Plex · last requests</h2><div id="preqs" class="preq"></div></div>
      <div class="face back"><h2>Plex · last added</h2><div id="preqsad" class="preq"></div></div>
    </div>
  </div>
    <div class="card" data-k="chat" style="--h:150px">
    <div class="face front chatface">
      <div class="chatrow">
        <button id="dropbtn" title="Chat messages" style="background:#0b0b0b;color:#06eaff;border:1px solid #1a1a1a">≡</button>
        <input id="q" placeholder="Say something to Hermes…" autocomplete="off">
        <button class="send" id="send">Send</button>
      </div>
    </div>
  </div>
  <div class="dropup" id="dropup"><div class="dr-msgs" id="drmsgs"></div></div>
  <div class="card avcard" data-k="av">
    <div class="avi-wrap"><canvas id="avatar" width="220" height="220" aria-hidden="true"></canvas></div>
  </div>
    <div class="card" data-k="ph" style="--h:110px">
    <div class="face front"><h2>Pi-hole · blocked</h2>
      <div class="phleft">
        <div class="phbig" id="phbig">–</div>
        <div class="phsub" id="phsub">–</div>
      </div>
      <div id="phsparkwrap"></div>
    </div>
  </div>
</main>
<div class="avdrop">

/* ==== hyper-grid: perspective 3D grid + cursor parallax + warp on mouse speed ==== */
(function(){
  const cv = document.getElementById('hypergrid'), ctx = cv.getContext('2d');
  const host = cv.parentElement || document.body;
  let W, H;
  function fit(){ const r = host.getBoundingClientRect(); W = cv.width = Math.max(60, r.width); H = cv.height = Math.max(60, r.height); }
  fit(); addEventListener('resize', fit);
  let mx = .5, my = .5;
  addEventListener('mousemove', e => {
    mx = (e.clientX / innerWidth - .5) * 2;
    my = (e.clientY / innerHeight - .5) * 2;
  });
  function frame(){
    ctx.clearRect(0, 0, W, H);
    const gap = 26;
    const ox = ((mx * 10) % gap + gap) % gap, oy = ((my * 10) % gap + gap) % gap;
    for (let y = oy - gap/2; y < H + gap; y += gap){
      for (let x = ox - gap/2; x < W + gap; x += gap){
        // parallax drift by distance from center for subtle depth
        const dx = (x - W/2) / W, dy = (y - H/2) / H;
        const px = x - mx * 14 * (0.4 + Math.abs(dx)), py = y - my * 14 * (0.4 + Math.abs(dy));
        ctx.beginPath();
        ctx.arc(px, py, 1.1, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(6,234,255,.16)';
        ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ==== morphing thinking orb (ported: dotted canvas orb + label cycle + answer morph) ==== */
const MO = (() => {
  const R = 66, SZ = 220;
  const cv = document.createElement('canvas');
  cv.width = SZ; cv.height = SZ; cv.style.cssText = 'width:'+SZ+'px;height:'+SZ+'px;margin:0 auto;display:block';
  const ctx = cv.getContext('2d');
  // dots: 16 rings sphere
  const dots = [];
  const TAU = Math.PI * 2;
  for (let k = 0; k < 16; k++) {
    const y = 1 - ((k + .5) / 16) * 2, r = Math.sqrt(1 - y * y);
    const m = Math.max(4, Math.round(30 * r));
    for (let j = 0; j < m; j++) {
      const a = (j / m) * TAU + k * .35;
      dots.push({x: Math.cos(a) * r, y, z: Math.sin(a) * r, s: Math.random() * 6.28});
    }
  }
  let alpha = 0, spin = 0, rot = 0, t = 0, raf = 0, dead = false;
  const lit = new Float32Array(dots.length);
  function frame(now){
    raf = 0;
    if (dead) return;
    const dt = Math.min(.05, (now - (frame.l || now)) / 1000); frame.l = now;
    t += dt; spin = .6; rot += spin * dt;
    ctx.clearRect(0,0,SZ,SZ);
    const cyw = Math.cos(rot), syw = Math.sin(rot);
    const CP = Math.cos(.35), SP = Math.sin(.35);
    const N = dots.length;
    for (let pass = 0; pass < 2; pass++){
      for (let n = 0; n < N; n++){
        const d = dots[n];
        const x1 = d.x * cyw + d.z * syw, z1 = -d.x * syw + d.z * cyw;
        const y2 = d.y * CP - z1 * SP, z2 = d.y * SP + z1 * CP;
        const f = 2.8 / (2.8 - z2), depth = (z2 + 1) / 2;
        // shimmer twinkle
        const tw = .55 + .25 * Math.sin(d.s + t * 1.6) + .4 * depth * depth;
        let a = tw * (alpha || 0);
        a = Math.min(1, a);
        if (a <= .01) continue;
        if ((depth >= .5) !== (pass === 1)) continue;
        const sx = SZ/2 + x1 * R * f, sy = SZ/2 - y2 * R * f;
        const rad = 1.4 * (.45 + .75 * depth) * f;
        // orange → cream blend by depth
        const mix = depth * .6 + .25 * Math.sin(d.s + t);
        ctx.fillStyle = `rgba(${232 + (241-232)*mix},${84 + (215-84)*mix},${4 + (200-4)*mix},${a.toFixed(3)})`;
        ctx.beginPath(); ctx.arc(sx, sy, rad, 0, TAU); ctx.fill();
      }
    }
    if (alpha > .002) raf = requestAnimationFrame(frame);
    else ctx.clearRect(0,0,SZ,SZ);
  }
  function ensure(){ if (!raf && !dead && alpha > .002){ frame.l = performance.now(); raf = requestAnimationFrame(frame); } }
  function show(){ alpha = 1; ensure(); }
  function hide(){ alpha = 0; }
  return {cv, show, hide, get alpha(){return alpha;}};
})();
