<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hermes — Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ==== V3 palette — huemint brand-intersection 031216-46656c-e85404-f1d7c8 ==== */
  :root{
    --bg:#031216; --grid:#0a2a33; --surface:#0a2730; --surface2:#0d3140; --raised:#123a47;
    --teal:#46656c; --cream:#f1d7c8; --orange:#e85404; --orange-soft:rgba(232,84,4,.14);
    --ink:#e9f4f4; --dim:#8fb0b0; --faint:rgba(241,215,200,.12);
    --ok:#7ee0a3; --warn:#ffb15c; --bad:#ff6d4d;
    --f-disp:"Chakra Petch", sans-serif; --f-body:"Inter", sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--f-body);color:var(--ink);background:var(--bg);
    display:grid;grid-template-columns:minmax(0,1fr) 240px;grid-template-rows:52px 1fr}

  /* ==== hyper-grid canvas background ==== */
  #hypergrid{position:fixed;inset:0;z-index:0;opacity:.5}
  header,main,aside,#chatdock{position:relative;z-index:1}

  header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 20px;
    border-bottom:1px solid var(--faint);background:rgba(3,18,22,.6);backdrop-filter:blur(4px)}
  .logo{font-family:var(--f-disp);font-size:18px;font-weight:700;letter-spacing:.06em;color:var(--cream)}
  .logo b{color:var(--orange);font-weight:700}
  .clock{margin-left:auto;font-family:var(--f-disp);font-variant-numeric:tabular-nums;font-size:20px;color:var(--dim)}
  .clock b{color:var(--cream);font-weight:500}

  /* ==== small flip cards (card-14 port) ==== */
  main{height:calc(100vh - 52px);padding:12px 16px 12px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
    display:grid;gap:10px;min-width:0;
    grid-template-columns:repeat(4,minmax(0,1fr));
    grid-template-rows:96px 96px minmax(140px, 1fr);
    grid-template-areas:
      "mem disk load ctr"
      "eco eco plex queue"
      "preqs preqs svcs svcs"}
  main::-webkit-scrollbar{display:none}
  main>*{min-width:0}
  .card[data-k="mem"]{grid-area:mem}
  .card[data-k="disk"]{grid-area:disk}
  .card[data-k="load"]{grid-area:load}
  .card[data-k="ctr"]{grid-area:ctr}
  .card[data-k="eco"]{grid-area:eco}
  .card[data-k="plex"]{grid-area:plex}
  .card[data-k="queue"]{grid-area:queue}
  .card[data-k="svcs"]{grid-area:svcs}

  .card{--h:110px;perspective:900px;background:transparent;border:none}
  .flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,0,0,1)}
  .card:hover .flip{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;
    border:1px solid rgba(70,101,108,.5);padding:10px 12px;overflow:hidden;
    background:linear-gradient(180deg,var(--surface2),var(--surface))}
  .face.back{transform:rotateY(180deg);background:linear-gradient(180deg,var(--raised),var(--surface))}
  .face h2{font-family:var(--f-disp);font-size:8px;font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);margin-bottom:4px}
  .face .big{font-family:var(--f-disp);font-size:15px;font-weight:700;color:var(--cream);line-height:1.2;
    font-variant-numeric:tabular-nums}
  .face .sub{color:var(--dim);font-size:8px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .face.back .stat{display:flex;justify-content:space-between;gap:10px;font-size:8px;color:var(--dim);
    padding:2px 0;border-bottom:1px dashed rgba(70,101,108,.4)}
  .face.back .stat b{color:var(--cream);font-weight:600;text-align:right}
  .face .more{position:absolute;right:10px;bottom:6px;font-size:7px;letter-spacing:.1em;color:var(--orange);
    opacity:.8}

  /* services pills (front face of nothing — service detail moved into hover card too) */
  .svc{display:flex;flex-wrap:wrap;gap:4px;font-size:8px;max-height:70px;overflow-y:auto;scrollbar-width:none}
  .svc::-webkit-scrollbar{display:none}
  .svc span{display:flex;align-items:center;gap:3px;padding:2px 6px;background:rgba(3,18,22,.7);
    border:1px solid rgba(70,101,108,.5);border-radius:6px;color:var(--dim)}
  .svc b{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:0 0 auto}
  .svc b.d{background:var(--bad)}
  .q{display:flex;flex-direction:column;gap:4px;font-size:9px}
  .q .it{display:flex;gap:6px;align-items:baseline;padding:4px 6px;background:rgba(3,18,22,.7);
    border:1px solid rgba(70,101,108,.5);border-radius:6px}
  .q .t{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q .s{color:var(--orange);font-size:7px;text-transform:uppercase;letter-spacing:.07em}
  .q .g{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pl .it{display:flex;gap:7px;align-items:center;padding:4px 6px;border:1px solid rgba(70,101,108,.5);
    border-radius:6px;background:rgba(3,18,22,.7)}
  .pl .play{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;
    border-left:7px solid var(--orange);flex:0 0 auto}
  .pl .prog{width:100%;height:3px;background:rgba(241,215,200,.12);border-radius:2px;overflow:hidden;margin-top:2px}
  .pl .prog>i{display:block;height:100%;background:var(--orange)}
  .empty{color:var(--dim);font-size:9px;font-style:italic}

  /* ecoflow battery visuals */
  .batt{display:flex;align-items:center;gap:12px}
  .batt .bwrap{width:120px;height:56px;border:2px solid var(--teal);border-radius:8px;position:relative;padding:4px}
  .batt .bwrap::after{content:"";position:absolute;right:-7px;top:50%;transform:translateY(-50%);
    width:5px;height:20px;background:var(--teal);border-radius:0 3px 3px 0}
  .batt .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--orange),#ff9a4d);
    width:var(--soc,50%);transition:width .8s}
  .batt .pct{font-family:var(--f-disp);font-size:22px;font-weight:700;color:var(--cream)}
  .batt .meta{font-size:8px;color:var(--dim);line-height:1.5}
  .batt .meta b{color:var(--orange);font-weight:600}


  /* ==== GLARE CARD (ported framer-motion glare-cards, vanilla) ==== */
  .card.g { transform-style:preserve-3d; transition:transform .35s ease, box-shadow .5s ease; will-change:transform; }
  .card.g .gglare, .card.g .gshine { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .5s ease; z-index:5; border-radius:inherit; }
  .card.g .gshine { background:linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent); width:200%; left:-50%; transform:rotate(15deg); }
  .card.g:hover { box-shadow:0 0 50px -12px rgba(0,0,0,.8); }
  .card.g:hover .gglare, .card.g:hover .gshine { opacity:1; }
  .card.g:hover .gshine { opacity:.10; }
  .card.g .inner { transform:translateZ(30px); height:100%; }

  .preq{display:flex;flex-direction:column;gap:4px;margin-top:2px}
  .preq div{display:flex;gap:6px;align-items:baseline;font-size:8px;color:var(--cream);white-space:nowrap;overflow:hidden}
  .preq b{color:var(--orange);font-size:8px}
  .preq span{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
  /* ==== right chat column ==== */
  aside{grid-row:2;grid-column:2;display:flex;flex-direction:column;border-left:1px solid var(--faint);
    background:rgba(3,18,22,.55);backdrop-filter:blur(4px);min-height:0;min-width:0;position:relative}
  /* avatar: sits so its bottom edge touches the top of the chat dock (composer) */
  .avi-wrap{position:absolute;right:10px;bottom:52px;width:96px;height:96px;pointer-events:none}
  #avatar{width:96px;height:96px}
  .avrow{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center}
  #avpick{background:rgba(3,18,22,.8);color:var(--dim);border:1px solid rgba(70,101,108,.6);
    border-radius:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;
    font-family:var(--f-body);outline:none}
  #reply{flex:1;overflow:auto;padding:8px 14px 10px;font-size:12px;line-height:1.55;color:var(--ink);
    white-space:pre-wrap;min-height:0}
  #reply .m{color:var(--dim);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;margin-top:12px}
  #reply .m:first-child{margin-top:0}

  /* chat dock with thinking orb (anark orb port: pulsing ring orb + input) */
  #chatdock{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--faint);
    background:rgba(3,18,22,.6);align-items:center}
  .orb{width:30px;height:30px;border-radius:50%;flex:0 0 auto;position:relative;
    background:radial-gradient(circle at 35% 30%, rgba(232,84,4,.85), rgba(232,84,4,.15) 65%, transparent);
    box-shadow:0 0 14px rgba(232,84,4,.5)}
  .orb::before{content:"";position:absolute;inset:-6px;border-radius:50%;
    border:1.5px solid rgba(232,84,4,.5);animation:orbpulse 1.6s ease-out infinite}
  @keyframes orbpulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:0}}
  body.thinking .orb::after{content:"";position:absolute;inset:6px;border-radius:50%;
    background:conic-gradient(var(--orange),transparent 60%);animation:orbspin .9s linear infinite}
  @keyframes orbspin{to{transform:rotate(360deg)}}
  input#q{flex:1 1 0;background:rgba(3,18,22,.85);border:1px solid rgba(70,101,108,.6);color:var(--cream);
    border-radius:9px;padding:9px 11px;font-size:12px;font-family:var(--f-body);outline:none;min-width:0}
  input#q:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
  button.send{background:var(--orange);border:none;color:#031216;font-weight:600;font-family:var(--f-body);
    border-radius:9px;padding:9px 14px;font-size:12px;cursor:pointer;transition:filter .12s}
  button.send:hover{filter:brightness(1.12)}
  button.send:disabled{opacity:.4;cursor:default}
  #avatar .mouth{transform-origin:50% 60%}
  #avatar.talking .mouth{animation:talk .28s infinite alternate}
  @keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
  /* thinking: shimmer reply line */
  body.thinking #reply .think::after{content:"";display:inline-block;width:8px;height:8px;margin-left:4px;
    border-radius:50%;background:var(--orange);animation:dotblink 1s infinite alternate}
  @keyframes dotblink{from{opacity:.25}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .orb::before,body.thinking .orb::after{animation:none}
    .card:hover .flip{transform:none}
  }
</style>
</head>
<body>
<canvas id="hypergrid"></canvas>
<header>
  <div class="logo">Her<b>mes</b> <span style="font-weight:400;color:var(--dim);font-size:12px">· wall v3.1</span></div>
  <div class="clock" id="clock">--:--</div>
</header>

<main id="board">
  <div class="card" data-k="mem" data-h="110" style="--h:110px">
    <div class="flip">
      <div class="face front"><h2>Memory</h2><div class="big" id="memd">–</div>
        <div class="sub" id="memsub">–</div><div class="more">hover ⤿</div></div>
      <div class="face back" id="memback"></div>
    </div>
  </div>
  <div class="card" data-k="disk" style="--h:110px">
    <div class="flip">
      <div class="face front"><h2>Storage</h2><div class="big" id="diskd">–</div>
        <div class="sub" id="disksub">–</div><div class="more">hover ⤿</div></div>
      <div class="face back" id="diskback"></div>
    </div>
  </div>
  <div class="card" data-k="load" style="--h:110px">
    <div class="flip">
      <div class="face front"><h2>CPU load</h2><div class="big" id="load">–</div>
        <div class="sub" id="loadsub">–</div><div class="more">hover ⤿</div></div>
      <div class="face back" id="loadback"></div>
    </div>
  </div>
  <div class="card" data-k="ctr" style="--h:110px">
    <div class="flip">
      <div class="face front"><h2>Containers</h2><div class="big" id="ctr">–</div>
        <div class="sub" id="ctrsub">docker containers</div><div class="more">hover ⤿</div></div>
      <div class="face back" id="ctrback"></div>
    </div>
  </div>

  <div class="card" data-k="eco" style="--h:150px">
    <div class="flip">
      <div class="face front"><h2>EcoFlow · RIVER 2 Pro</h2>
        <div class="batt">
          <div class="bwrap"><div class="fill" id="ecofill" style="--soc:0%"></div></div>
          <div>
            <div class="pct" id="ecosoc">–</div>
            <div class="meta"><b id="ecoin">▼ 0W</b> in · <b id="ecoout">▲ 0W</b> out</div>
          </div>
        </div><div class="more">hover ⤿</div></div>
      <div class="face back" id="ecoback"></div>
    </div>
  </div>
  <div class="card" data-k="plex" style="--h:150px">
    <div class="flip">
      <div class="face front"><h2>Now playing</h2><div class="q pl" id="plex"><div class="empty">Nothing playing</div></div></div>
      <div class="face back" id="plexback"></div>
    </div>
  </div>
  <div class="card" data-k="queue" style="--h:150px">
    <div class="flip">
      <div class="face front"><h2>Download queue</h2><div class="q" id="queue"><div class="empty">Queue empty</div></div></div>
      <div class="face back" id="queueback"></div>
    </div>
  </div>

  <div class="card" data-k="preqs" style="--h:150px">
    <div class="flip">
      <div class="face front"><h2>Plex adds · last 5</h2><div id="preqs" class="preq"></div></div>
      <div class="face back" id="preqsback"></div>
    </div>
  </div>
  <div class="card" data-k="svcs" style="--h:150px">
    <div class="flip">
      <div class="face front"><h2>Service detail</h2><div class="svc" id="svcs"></div></div>
      <div class="face back" id="svcsback"></div>
    </div>
  </div>
</main>

<aside>
  <div class="avrow">
    <select id="avpick" aria-label="Avatar">
      <option value="ren">ren</option>
      <option value="kei" selected>kei</option>
      <option value="rice">rice</option>
      <option value="jinx">jinx</option>
      <option value="base">base</option>
    </select>
  </div>
  <div id="reply"></div>
  <div class="avi-wrap"><canvas id="avatar" width="220" height="220" aria-hidden="true"></canvas></div>
  <div id="chatdock">
    <div class="orb" aria-hidden="true"></div>
    <input id="q" placeholder="Say something to Hermes…" autocomplete="off">
    <button class="send" id="send">Send</button>
  </div>
</aside>

<script>window.process = {env: {NODE_ENV: 'production'}};</script>
<script src="/av/vendor/live2dcubismcore.min.js"></script>
<script src="/av/vendor/pixi.min.js"></script>
<script src="/av/vendor/pixi-live2d-display.min.js"></script>
<script>
/* ==== hyper-grid: perspective 3D grid + cursor parallax + warp on mouse speed ==== */
(function(){
  const cv = document.getElementById('hypergrid'), ctx = cv.getContext('2d');
  let W, H;
  function fit(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  fit(); addEventListener('resize', fit);
  let mx = .5, my = .5, warp = 0;
  addEventListener('mousemove', e => {
    const nx = e.clientX/innerWidth, ny = e.clientY/innerHeight;
    warp = Math.min(1, warp + Math.hypot(nx-mx, ny-my)*3);
    mx = nx; my = ny;
    setTimeout(()=>warp = Math.max(0, warp - .05), 80);
  });
  function frame(t){
    warp = Math.max(0, warp - .015);
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(70,101,108,.25)';
    ctx.lineWidth = 1;
    const hz = H*.42, speed = (t*.00006) + warp*.01;
    const px0 = (mx-.5)*80, py0 = (my-.5)*30;
    // horizontal lines receding
    for (let i=0;i<26;i++){
      const p = ((i/26 + speed))%1;
      const y = hz + p*p*(H-hz);
      ctx.globalAlpha = p*.8;
      ctx.beginPath(); ctx.moveTo(0, y+py0*p); ctx.lineTo(W, y+py0*p); ctx.stroke();
    }
    // verticals converging to vanishing point
    for (let i=-14;i<=14;i++){
      ctx.globalAlpha = .5;
      ctx.beginPath();
      ctx.moveTo(W/2 + i*24*Math.max(.2,(mx*2)), H);
      ctx.lineTo(W/2 + i*(24+px0)*.02, hz+py0);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ==== avatar (same proven loader as V2) ==== */
const AV = document.getElementById('avatar');
function svgFallback(){
  if (AV.dataset.fallback) return;
  AV.dataset.fallback = 1;
  AV.outerHTML = `<svg id="avatar" viewBox="0 0 100 100" style="width:96px;height:96px">
    <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(232,84,4,.35)" stroke-width="1.5"/>
    <circle cx="38" cy="44" r="4.5" fill="#f1d7c8"/><circle cx="62" cy="44" r="4.5" fill="#f1d7c8"/>
    <ellipse cx="50" cy="60" rx="9" ry="4" fill="#f1d7c8" opacity=".85"/>
  </svg>`;
}
const AVATAR_MODELS = {
  ren:  '/av/ren/ren.model3.json',
  kei:  '/av/kei/kei_basic_free.model3.json',
  rice: '/av/rice/rice_pro_t03.model3.json',
  jinx: '/av/jinx/jinx.model3.json',
};
let model = null, pixiApp = null;
const AVATAR_STORE = AVATAR_MODELS;
async function loadAvatar(name){
  if (!window.PIXI || !PIXI.live2d || !PIXI.live2d.Live2DModel) return svgFallback();
  try{
    if (!pixiApp){
      pixiApp = new PIXI.Application({view: AV, width: 220, height: 220,
        backgroundAlpha: 0, antialias: true});
    }
    if (model){ pixiApp.stage.removeChild(model); model.destroy(); model = null; }
    model = await PIXI.live2d.Live2DModel.from(AVATAR_MODELS[name],
      {autoInteract: false, autoUpdate: true});
    pixiApp.stage.addChild(model);
    const FIT = {
      ren:  {s: 0.045, fx: 0.50, fy: 0.40},
      kei:  {s: 0.16, fx: 0.50, fy: 0.35},
      rice: {s: 0.068, fx: 0.50, fy: 0.45},
      jinx: {s: 0.052, fx: 0.62, ay: -80},
    }[name] || {s: 0.30, fx: 0.50, fy: 0.50};
    model.scale.set(FIT.s);
    model.x = 110 - model.width * FIT.fx;
    model.y = (FIT.ay !== undefined) ? FIT.ay : 110 - model.height * FIT.fy;
    document.getElementById('reply').style.opacity = 1;
  }catch(e){ console.warn('live2d init failed for ' + name, e); model = null; svgFallback(); }
}
const avpick = document.getElementById('avpick');
avpick.onchange = () => setAvatar(avpick.value);
const savedAv = localStorage.getItem('avatar');
if (AVATAR_STORE[savedAv] || savedAv === 'base') avpick.value = savedAv;
function setAvatar(name){
  localStorage.setItem('avatar', name);
  if (name === 'base'){
    if (model){ pixiApp.stage.removeChild(model); model.destroy(); model = null; }
    svgFallback();
    return;
  }
  loadAvatar(name);
}
setAvatar(avpick.value);
document.addEventListener('mousemove', e => {
  if (!model) return;
  const r = AV.getBoundingClientRect();
  model.focus(e.clientX - r.left, e.clientY - r.top);
});
function avTalk(ms){
  if (!model) return;
  const t0 = Date.now(), until = t0 + ms;
  const drive = () => {
    if (Date.now() > until){
      model.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', 0); return;
    }
    model.internalModel.coreModel.setParameterValueById('ParamMouthOpenY',
      0.25 + 0.55 * Math.abs(Math.sin(Date.now() / 110)));
    requestAnimationFrame(drive);
  };
  drive();
}

/* ==== chat with thinking orb ==== */
const REPLY = document.getElementById('reply');
function bubble(text){
  const wrap = document.createElement('div');
  const m = document.createElement('div'); m.className = 'm'; m.textContent = 'hermes';
  const body = document.createElement('div'); body.textContent = text;
  wrap.appendChild(m); wrap.appendChild(body);
  REPLY.appendChild(wrap); REPLY.scrollTop = REPLY.scrollHeight;
  avTalk(Math.min(30000, 1500 + text.length * 45));
}
const sendBtn = document.getElementById('send'), inp = document.getElementById('q');
async function ask(){
  const t = inp.value.trim();
  if (!t || sendBtn.disabled) return;
  inp.value = ''; sendBtn.disabled = true;
  document.body.classList.add('thinking');           // orb spins + shimmer
  const wrap = document.createElement('div');
  const m = document.createElement('div'); m.className = 'm'; m.textContent = 'hermes';
  const tv = document.createElement('div'); tv.className = 'think'; tv.textContent = 'thinking';
  wrap.appendChild(m); wrap.appendChild(tv); REPLY.appendChild(wrap); REPLY.scrollTop = REPLY.scrollHeight;
  try{
    const r = await fetch('/ask', {method:'POST',
      headers: {'Content-Type':'application/json'}, body: JSON.stringify({text: t})});
    const j = await r.json();
    wrap.remove();
    bubble(r.ok ? (j.reply || '(no reply)') : (j.detail || 'error'));
  }catch(e){ wrap.remove(); bubble('gateway unreachable'); }
  finally{ sendBtn.disabled = false; document.body.classList.remove('thinking'); inp.focus(); }
}
sendBtn.onclick = ask;
inp.onkeydown = e => { if (e.key === 'Enter') ask(); };

/* ==== clock ==== */
function tick(){
  const now = new Date();
  document.getElementById('clock').innerHTML =
    '<b>' + now.toLocaleTimeString('en-GB', {timeZone: 'America/Montevideo', hour: '2-digit', minute: '2-digit', hour12: false}) + '</b>';
}
tick(); setInterval(tick, 5000);

/* ==== flip-card back faces (compact detail rows) ==== */
let last = null;
function statRows(el, rows){
  el.innerHTML = '';
  for (const [k, v] of rows){
    const r = document.createElement('div'); r.className = 'stat';
    const a = document.createElement('span'); a.textContent = k;
    const b = document.createElement('b'); b.textContent = v;
    r.appendChild(a); r.appendChild(b); el.appendChild(r);
  }
}

/* ==== service pills ==== */
function renderSvc(d){
  const svcs = document.getElementById('svcs'); svcs.innerHTML = '';
  const entries = Object.entries(d.services || {});
  for (const [name, state] of entries){
    const s = String(state);
    const sp = document.createElement('span');
    const dot = document.createElement('b'); dot.className = s.startsWith('up') ? '' : 'd';
    const u = document.createElement('u'); u.textContent = name;
    sp.appendChild(dot); sp.appendChild(u); svcs.appendChild(sp);
  }
  statRows(document.getElementById('svcsback'), entries.map(([n,s]) => [n, String(s)]));
}

/* ==== glare tilt ==== */
for (const c of document.querySelectorAll('.card')) {
  c.classList.add('g');
  const gl = document.createElement('div'); gl.className = 'gglare';
  const sh = document.createElement('div'); sh.className = 'gshine';
  c.appendChild(gl); c.appendChild(sh);
  c.addEventListener('mousemove', e => {
    const r = c.getBoundingClientRect();
    const nx = (e.clientX - r.left) / r.width - .5, ny = (e.clientY - r.top) / r.height - .5;
    // tilt the card itself; the inner .flip keeps its own rotateY — they compose
    c.style.transform = `rotateX(${-ny*10}deg) rotateY(${nx*12}deg)`;
    gl.style.background = `radial-gradient(circle at ${100 - nx*100}% ${100 - ny*100}%, rgba(232,84,4,.25) 0%, transparent 80%)`;
    sh.style.transform = `rotate(15deg) translateX(${-nx*30}%)`;
  });
  c.addEventListener('mouseleave', () => { c.style.transform = ''; });
}

/* ==== stats polling ==== */
async function refresh(){
  try{
    const r = await fetch('/stats');
    if (!r.ok) return;
    const d = await r.json();
    last = d;
    const h = d.host;
    if (h){
      document.getElementById('load').textContent = h.load1.toFixed(2);
      document.getElementById('loadsub').textContent = `${h.cpu_count} cores · ${(h.load1 / h.cpu_count * 100).toFixed(0)}% load`;
      const memPct = Math.round(h.mem_used_gb / h.mem_total_gb * 100);
      document.getElementById('memd').textContent = memPct + '%';
      document.getElementById('memsub').textContent = `${memUsed(0)} GB`;
      statRows(document.getElementById('memback'), [
        ['used', h.mem_used_gb + ' / ' + h.mem_total_gb + ' GB'],
        ['percent', memPct + '%'],
        ['swap', h.swap_used_gb + ' / ' + h.swap_total_gb + ' GB'],
        ['warn >', '85%']]);
      document.getElementById('diskd').textContent = h.disk_pct + '%';
      document.getElementById('disksub').textContent = `${h.disk_used_gb} / ${h.disk_total_gb} GB`;
      statRows(document.getElementById('diskback'), [
        ['used', h.disk_used_gb + ' / ' + h.disk_total_gb + ' GB'],
        ['percent', h.disk_pct + '%'],
        ['free', (h.disk_total_gb - h.disk_used_gb) + ' GB'],
        ['warn >', '80%']]);
      statRows(document.getElementById('loadback'), [
        ['1 min load', h.load1.toFixed(2)],
        ['cores', h.cpu_count],
        ['load percent', Math.round(h.load1 / h.cpu_count * 100) + '%']]);
      document.getElementById('ctr').textContent = Object.keys(d.containers || {}).length;
      document.getElementById('ctrsub').textContent = Object.keys(d.containers || {}).length + ' docker containers';
      statRows(document.getElementById('ctrback'), [
        ['total', Object.keys(d.containers || {}).length],
        ['services', Object.keys(d.services || {}).length],
        ['up services', Object.values(d.services || {}).filter(v => String(v).startsWith('up')).length]]);
    }
    // plex + queue (same as V2)
    const pl = document.getElementById('plex'); pl.innerHTML = '';
    if (!(d.plex || []).length){
      const e = document.createElement('div'); e.className='empty'; e.textContent='Nothing playing'; pl.appendChild(e);
    } else {
      for (const v of d.plex){
        const it = document.createElement('div'); it.className='it';
        const left = document.createElement('div'); left.style.cssText='flex:1;min-width:0;overflow:hidden';
        const t1 = document.createElement('div'); t1.className='t'; t1.textContent = v.title;
        const prog = document.createElement('div'); prog.className='prog';
        const inner = document.createElement('i'); inner.style.width = v.progress + '%'; prog.appendChild(inner);
        left.appendChild(t1); left.appendChild(prog);
        const pw = document.createElement('div'); pw.className='play';
        it.appendChild(pw); it.appendChild(left); pl.appendChild(it);
      }
    }
    const qu = document.getElementById('queue'); qu.innerHTML = '';
    const items = [
      ...((d.arr && d.arr.radarr && d.arr.radarr.items) || []).map(x => ({...x, app: 'radarr'})),
      ...((d.arr && d.arr.sonarr && d.arr.sonarr.items) || []).map(x => ({...x, app: 'sonarr'})),
    ];
    if (!items.length){
      const e = document.createElement('div'); e.className='empty'; e.textContent='Queue empty'; qu.appendChild(e);
    } else {
      for (const it of items){
        const row = document.createElement('div'); row.className='it';
        const app = document.createElement('span'); app.className='s'; app.textContent = it.app;
        const t = document.createElement('div'); t.className='t'; t.textContent = it.title || '(untitled)';
        const gg = document.createElement('span'); gg.className='g';
        gg.textContent = it.left_gb ? it.left_gb + ' GB left' : (it.status || '');
        row.appendChild(app); row.appendChild(t); row.appendChild(gg); qu.appendChild(row);
      }
      statRows(document.getElementById('queueback'), items.slice(0,6).flatMap(it => [[it.title||'(untitled)', it.app],['left', it.left_gb ? it.left_gb+' GB' : (it.status||'-')]]));
      document.getElementById('queueback').style.display = 'none';
    }
  renderSvc(d);
  fetch('/plexreqs').then(r=>r.json()).then(rs => {
    const el = document.getElementById('preqs');
    if (el) el.innerHTML = rs.map(x => `<div><b>${x.kind==='movie'?'MOV':'EP'}</b><span>${x.title}</span></div>`).join('') || '<div class="empty">no adds yet</div>';
    statRows(document.getElementById('preqsback'), rs.map(x => [x.date.slice(0,10), x.title]));
  }).catch(()=>{});

  }catch(e){ /* keep last good values */ }
}
function memUsed(x){ const h = last.host; return h ? h.mem_used_gb : '–'; }
async function refreshEco(){
  try{
    const r = await fetch('/ecoflow'); const d = await r.json();
    const fill = document.getElementById('ecofill');
    const back = document.getElementById('ecoback');
    if (!d.ok){ document.getElementById('ecosoc').textContent = '–'; return; }
    document.getElementById('ecosoc').textContent = d.soc + '%';
    fill.style.setProperty('--soc', d.soc + '%');
    document.getElementById('ecoin').textContent = '▼ ' + Math.round(d.inW) + 'W';
    document.getElementById('ecoout').textContent = '▲ ' + Math.round(d.outW) + 'W';
    statRows(back, [
      ['battery', d.soc + '%'],
      ['input', Math.round(d.inW) + ' W'],
      ['output', Math.round(d.outW) + ' W'],
      ['status', d.inW > 0 ? 'charging' : 'discharging']]);
  }catch(e){}
}
refresh(); setInterval(refresh, 15000);
refreshEco(); setInterval(refreshEco, 30000);
</script>
