<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hermes — Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ==== V3 palette — huemint brand-intersection 031216-46656c-e85404-f1d7c8 ==== */
  :root{ /* mint-slate (@serafimcloud) dark adaptation */
    --bg:#0a0d0b; --grid:#111613; --surface:#0f1411; --surface2:#141a16; --raised:#1a211d;
    --teal:#242b27; --cream:#eceae4; --orange:#7fd6a4; --orange-soft:rgba(127,214,164,.14);
    --red:#c96b5e; --ink:#eceae4; --dim:#8b968f; --faint:rgba(236,234,228,.10);
    --ok:#7fd6a4; --warn:#d4b48c; --bad:#c96b5e; --slate:#627884; --tan:#998466;
    --f-disp:"Chakra Petch", sans-serif; --f-body:"Inter", sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--f-body);color:var(--ink);background:var(--bg);
    display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:26px 1fr}

  /* ==== hyper-grid canvas background ==== */
  #hypergrid{position:absolute;inset:0;z-index:0;opacity:.85;pointer-events:none}
  /* ==== avatar model dropup (bottom-right corner) ==== */
  .avdrop{position:fixed;right:4px;bottom:3px;z-index:50;font-family:var(--f-disp)}
  .avdrop #avtab{background:#0b0b0b;color:var(--cream);border:1px solid #1a1a1a;border-radius:8px;
    font:600 8px var(--f-disp);letter-spacing:.1em;padding:3px 7px;cursor:pointer;text-transform:uppercase;opacity:.65}
  .avdrop #avtab:hover{border-color:rgba(127,214,164,.5)}
  .avmenu{display:none;position:absolute;right:0;bottom:38px;background:rgba(5,5,5,.97);border:1px solid #1a1a1a;
    border-radius:10px;overflow:hidden;min-width:110px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
  .avdrop.open .avmenu{display:block}
  .avmenu button{display:block;width:100%;text-align:left;background:none;border:none;color:#cfcfcf;
    font:600 9px var(--f-disp);letter-spacing:.08em;padding:4px 10px;cursor:pointer;text-transform:uppercase}
  .avmenu button:hover{background:rgba(127,214,164,.08);color:var(--ok)}
  .avmenu button.on{color:var(--ok)}
  /* avatar cell */
  .avcard{perspective:none}
  .avcard .avi-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);width:148px;height:148px;pointer-events:none}
  #avatar{width:148px;height:148px}

  /* ==== calendar flip: week events back face ==== */
  .card[data-k="cal"] .face{display:flex;flex-direction:column}
  .wkl{flex:1;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:6px;margin-top:6px;min-height:0}
  .wkl::-webkit-scrollbar{display:none}
  .wkd{padding:6px 8px;background:rgba(127,214,164,.05);border:1px solid #1c231f;border-radius:8px}
  .wkd .nm{font:600 10px var(--f-disp);color:var(--cream);letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wkd .when{font:600 8px var(--f-disp);color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
  .wkd .when b{color:var(--ok)}

  /* ==== glass calendar (vanilla port) ==== */
  .card[data-k="cal"] .face{display:flex;flex-direction:column}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .calmonth{font:700 14px var(--f-disp);letter-spacing:.02em;color:var(--cream)}
  .calmonth small{font:600 9px var(--f-disp);letter-spacing:.14em;color:var(--dim);margin-left:8px;text-transform:uppercase}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0;align-items:center;justify-items:center;flex:1}
  .calgrid .wd{font:600 8px var(--f-disp);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
  .calgrid button{width:16px;height:16px;border-radius:50%;border:none;background:none;color:var(--ink);
    font:600 10px var(--f-disp);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .calgrid button:disabled{color:var(--dim);cursor:default}
  .calgrid button.today{background:linear-gradient(135deg,#c96b5e,#d4b48c);color:#0a0d0b;font-weight:700}
  .calgrid button.ev{box-shadow:inset 0 -2px 0 var(--warn)}
  .calgrid button.ev.today{box-shadow:none}

  /* ==== card status list (vanilla port) ==== */
  .stl{display:flex;flex-direction:column;gap:4px;margin-top:6px;overflow:hidden}
  .stl .row{display:flex;align-items:center;gap:6px;background:rgba(20,26,22,.6);border:1px solid rgba(236,234,228,.08);border-radius:6px;padding:2px 6px;font-size:9px;color:var(--ink)}
  .stl .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stl .row .st{font:600 7.5px var(--f-disp);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .stl svg{flex:0 0 auto}
  /* ==== pihole bars ==== */
    header,main,aside,#chatdock{position:relative;z-index:1}

  header{grid-column:1/2;display:flex;align-items:center;gap:10px;padding:0 14px;
    border-bottom:1px solid var(--faint);background:#0b0b0b;backdrop-filter:blur(4px)}
  .logo{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--cream)}
  .logo b{color:var(--orange);font-weight:700}
  .clock{margin-left:auto;font-family:var(--f-disp);font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim)}
  .clock b{color:var(--cream);font-weight:500}

  /* ==== small flip cards (card-14 port) ==== */
  main{height:calc(100vh - 26px);padding:10px 16px;overflow:hidden;scrollbar-width:none;
    display:grid;gap:10px;min-width:0;
    grid-template-columns:repeat(12,minmax(0,1fr));
    grid-template-rows:repeat(3, minmax(0, 1fr));
    grid-template-areas:
      "sys sys sys ctr ctr ctr cal cal cal cal cal cal"
      "eco eco eco eco sl sl preqs preqs preqs preqs preqs preqs"
      "chat chat chat chat chat chat chat chat chat av av av"}
  main::-webkit-scrollbar{display:none}
  main>*{min-width:0}
  .card[data-k="sys"]{grid-area:sys}
      .card[data-k="ctr"]{grid-area:ctr}
  .card[data-k="eco"]{grid-area:eco}
  .card[data-k="preqs"]{grid-area:preqs}
  .card[data-k="chat"]{grid-area:chat}
    .card[data-k="av"]{grid-area:av}
  .card[data-k="cal"]{grid-area:cal}
  .card[data-k="sl"]{grid-area:sl}

  .card{--h:110px;perspective:900px;background:transparent;border:none}
  .flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,0,0,1)}
  .card:hover .flip{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;
    border:1px solid #1a1a1a;padding:10px 12px;overflow:hidden;
    background:linear-gradient(180deg,var(--surface2),var(--surface))}
  .face.back{transform:rotateY(180deg);background:linear-gradient(180deg,var(--raised),var(--surface))}
  .face h2{font-family:var(--f-disp);font-size:10px;font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);margin-bottom:4px}
  .face .big{font-family:var(--f-disp);font-size:15px;font-weight:700;color:var(--cream);line-height:1.2;
    font-variant-numeric:tabular-nums}
  .face .sub{color:var(--cream);font-size:10.5px;margin-top:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .face .extra{color:var(--dim);font-size:8.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .face .big{margin-top:6px}
  .face.back .stat{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--dim);
    padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
  .face.back .stat b{color:var(--cream);font-weight:600;text-align:right}
  .face .more{position:absolute;right:10px;bottom:6px;font-size:7px;letter-spacing:.1em;color:var(--orange);
    opacity:.8}

  /* services pills (front face of nothing — service detail moved into hover card too) */
  .svc{display:flex;flex-wrap:wrap;gap:4px;font-size:8px;max-height:70px;overflow-y:auto;scrollbar-width:none}
  .svc::-webkit-scrollbar{display:none}
  .svc span{display:flex;align-items:center;gap:3px;padding:2px 6px;background:#0b0b0b;
    border:1px solid #1a1a1a;border-radius:6px;color:var(--dim)}
  .svc b{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:0 0 auto}
  .svc b.d{background:var(--bad)}
  .q{display:flex;flex-direction:column;gap:4px;font-size:9px}
  .q .it{display:flex;gap:6px;align-items:baseline;padding:4px 6px;background:#0b0b0b;
    border:1px solid #1a1a1a;border-radius:6px}
  .q .t{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q .s{color:var(--orange);font-size:7px;text-transform:uppercase;letter-spacing:.07em}
  .q .g{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pl .it{display:flex;gap:7px;align-items:center;padding:4px 6px;border:1px solid #1a1a1a;
    border-radius:6px;background:#0b0b0b}
  .pl .play{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;
    border-left:7px solid var(--orange);flex:0 0 auto}
  .pl .prog{width:100%;height:3px;background:rgba(241,215,200,.12);border-radius:2px;overflow:hidden;margin-top:2px}
  .pl .prog>i{display:block;height:100%;background:var(--orange)}
  .empty{color:var(--dim);font-size:9px;font-style:italic}

  /* ecoflow battery visuals */
  .batt{display:flex;align-items:center;gap:12px}
  .batt .bwrap{width:120px;height:56px;border:2px solid var(--teal);border-radius:8px;position:relative;padding:4px}
  .batt .bwrap::after{content:"";position:absolute;right:-7px;top:50%;transform:translateY(-50%);
    width:5px;height:20px;background:var(--teal);border-radius:0 3px 3px 0}
  .batt .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#015b66,var(--orange));
    width:var(--soc,50%);transition:width .8s}
  .batt .pct{font-family:var(--f-disp);font-size:15px;font-weight:700;color:var(--cream)}
  .batt .meta{font-size:8px;color:var(--dim);line-height:1.5}
  .batt .meta b{color:var(--orange);font-weight:600}


  /* ==== card shell (tilt only, no glare) ==== */
  .card { transform-style:preserve-3d; transition:transform .35s ease; will-change:transform; overflow:hidden; clip-path:inset(0 round 12px); }

  .preq{display:flex;flex-direction:column;gap:4px;margin-top:2px}
  .preq div{display:flex;gap:6px;align-items:baseline;font-size:12px;color:var(--cream);white-space:nowrap;overflow:hidden}
  .preq b{color:var(--cyan);font:600 9px var(--f-disp);min-width:36px}
  .preq span{color:var(--dim);overflow:hidden;text-overflow:ellipsis}

  /* ==== eco watt history bars (spring) ==== */
  .bchart{position:absolute;inset:38px 12px 8px 12px;display:flex;align-items:flex-end;gap:6px}
  .bchart i{flex:1;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--orange),rgba(127,214,164,.25));
    height:0;transition:height .9s cubic-bezier(.34,1.4,.4,1)}
  .bchart i.o{background:linear-gradient(180deg,var(--cream),rgba(241,215,200,.2))}

  .mostat{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0;color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
  #reply:empty + .mostat{display:none}


  /* ==== thinking trace (thinking.tsx port) ==== */
  .trace{margin:2px 0 6px}
  .trace-head{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;
    font:600 10px var(--f-disp);letter-spacing:.06em;color:var(--dim);padding:2px 0;text-transform:uppercase}
  .trace-head:hover{color:var(--cream)}
  .trace-head .shimmer{background:linear-gradient(90deg,var(--dim) 35%,var(--cream) 50%,var(--dim) 65%);
    background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer-text 1.4s linear infinite}
  .trace-head .chev{transition:transform .3s}
  .trace.open .trace-head .chev{transform:rotate(180deg)}
  .trace-body{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s cubic-bezier(.23,1,.32,1),opacity .4s}
  .trace.open .trace-body{grid-template-rows:1fr;opacity:1}
  .trace-inner{overflow:hidden;margin-left:5px;padding-left:12px;position:relative}
  .trace-inner::before{content:"";position:absolute;left:3px;top:0;bottom:2px;width:1px;background:#242a26}
  .trace-row{display:flex;align-items:center;gap:7px;padding:3px 0;font:500 11px var(--f-body);color:#cfcfcf;animation:fadeup .32s cubic-bezier(.23,1,.32,1) both}
  .trace-row .sec{color:var(--dim);font-size:10px}
  .trace-row svg{flex:none;color:var(--dim)}
  .trace-row .spin{width:11px;height:11px;border-radius:50%;border:1.5px solid #31373b;border-top-color:#cfcfcf;animation:spin .7s linear infinite;flex:none}
  .trace-row.done svg{color:var(--ok)}
  @keyframes shimmer-text{0%{background-position:150%}100%{background-position:-50%}}
  @keyframes fadeup{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes spin{100%{transform:rotate(1turn)}}
  /* ==== chat FAB ==== */
  #chatfab{position:fixed;right:16px;bottom:16px;z-index:70;width:54px;height:54px;border-radius:50%;
    border:1px solid rgba(127,214,164,.35);background:radial-gradient(circle at 35% 30%, rgba(127,214,164,.35), rgba(127,214,164,.08) 60%, transparent);
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  #chatfab::before{content:"";width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d8fdff, var(--ok) 55%, #015b66)}
  body.chat-open #chatfab{display:none}
  .chatbtn{width:100%;padding:7px 10px;margin:0 0 6px;border-radius:8px;border:1px solid var(--faint);
    background:transparent;color:var(--dim);font:600 9px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  .chatbtn:hover{color:var(--cream);border-color:var(--orange)}

  .card[data-k="mem"] .big, .card[data-k="disk"] .big, .card[data-k="load"] .big{max-width:70%}

  .preq{overflow-y:auto;scrollbar-width:none}
  .preq::-webkit-scrollbar{display:none}
  .face[data-k="preqs"], .card[data-k="preqs"] .face{display:flex;flex-direction:column}
    .card[data-k="preqs"] .preq:first-of-type{flex:1 1 44%;min-height:0}
  .card[data-k="preqs"] .preq:last-of-type{flex:1 1 36%;min-height:0}

  /* ==== chat card ==== */
  .chatface{display:flex;flex-direction:column}
  .chatface .chatrow{margin-top:auto;margin-bottom:2px;display:flex;gap:6px;align-items:center}
splay:flex;gap:6px;align-items:center;position:relative;z-index:6}
  .chatrow input{flex:1;min-width:0;background:#0b0b0b;border:1px solid #1a1a1a;color:#fafafa;
    border-radius:8px;padding:8px 10px;font:12px var(--f-body)}
  .chatrow .send{border-radius:8px;border:1px solid rgba(127,214,164,.4);background:rgba(127,214,164,.12);
    color:var(--ok);font:600 11px var(--f-disp);letter-spacing:.08em;padding:8px 12px;cursor:pointer}
  .dropup{position:fixed;overflow:hidden;display:none;z-index:60;
    background:rgba(5,5,5,.98);border:1px solid #1a1a1a;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.7);
    display:none;flex-direction:column}
  .dropup.open{display:flex}
  .dr-msgs{flex:1;overflow-y:auto;padding:12px 14px;font-size:11.5px;line-height:1.55;color:#cfcfcf;scrollbar-width:none}
  .dr-msgs::-webkit-scrollbar{display:none}
  .dr-msgs .d{margin-bottom:7px}
  .dr-msgs .m{color:var(--ok);font:600 8px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
  .dr-msgs .m.user{color:#fafafa}
  .dr-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #151515}
  .dr-head span{font:600 8px var(--f-disp);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
  .dr-comp{padding:10px 12px;border-top:1px solid #151515}
  .dr-comp .chatrow input{background:#111;border-color:#222}
  
  /* stat card flex layout: header row, centered ring+text, spark bottom */
  .card[data-k="mem"] .face,.card[data-k="disk"] .face,.card[data-k="load"] .face{display:flex;flex-direction:column}
  .card[data-k="mem"] h2,.card[data-k="disk"] h2,.card[data-k="load"] h2{margin-left:0;flex:0 0 auto}
  .ringw{position:relative;width:48px;height:48px;flex:0 0 auto}
  .ringw .ring{position:absolute;inset:0;width:48px;height:48px;margin:0}
  .rpct{position:absolute;left:0;top:0;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
  .rpct b{font:700 9.5px var(--f-disp);color:var(--cream)}
  .rpct small{font:600 5.5px var(--f-disp);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
  .ring .rbg{fill:none;stroke:rgba(127,214,164,.10);stroke-width:4}
  .ring .rfg{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;
    stroke-dasharray:119.4;stroke-dashoffset:119.4;transition:stroke-dashoffset .8s cubic-bezier(.3,1,.4,1)}


  /* ==== magnetic cursor (exclusion / liquid-glass negative contrast) ==== */
  #mcur{position:fixed;left:0;top:0;width:24px;height:24px;border-radius:50%;
    background:#fff;mix-blend-mode:exclusion;pointer-events:none;z-index:9999;opacity:0;
    will-change:transform,width,height,border-radius;backdrop-filter:contrast(1.35);-webkit-backdrop-filter:contrast(1.35)}

  /* ==== starlink card ==== */
  .card[data-k="sl"] .face{display:flex;flex-direction:column}
  .slbig{font:700 12px var(--f-disp);color:var(--ok);letter-spacing:.08em;margin-top:2px}
  .slbig.bad{color:var(--bad)}
  .slmeta{margin-top:auto;display:flex;flex-direction:column;gap:4px}
  .slr{display:flex;justify-content:space-between;font:600 8.5px var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .slr b{color:var(--cream);font:600 10px var(--f-disp);font-variant-numeric:tabular-nums}

  /* ==== fused system ring chart (concentric port, vanilla) ==== */
  .card[data-k="sys"] .face{display:flex;flex-direction:column}
  .sysrow{flex:1;display:flex;align-items:center;gap:16px;min-height:0;margin-top:2px}
  .sysrings{position:relative;flex:none}
  .sysrings svg{display:block}
  .sysrings svg circle{fill:none;stroke-linecap:round}
  .sysleg{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .sysleg .li{display:flex;align-items:center;gap:7px;font:600 8px var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .sysleg .li i{width:8px;height:8px;border-radius:3px;flex:none}
  .sysleg .li b{margin-left:auto;color:var(--cream);font:700 10px var(--f-disp);font-variant-numeric:tabular-nums}
  .statrow{flex:1;display:flex;align-items:center;gap:14px;min-height:0}
  .card[data-k="mem"] .sub,.card[data-k="disk"] .sub,.card[data-k="load"] .sub{font-weight:600;font-size:10px;margin-top:0;line-height:1.4}
  .card[data-k="mem"] .extra,.card[data-k="disk"] .extra,.card[data-k="load"] .extra{margin-top:0}
  .card[data-k="mem"] .spark,.card[data-k="disk"] .spark,.card[data-k="load"] .spark{position:absolute;left:12px;right:12px;bottom:8px;height:18px;display:flex;align-items:flex-end;gap:3px;margin-left:0}
/* ==== right chat column ==== */
  aside{position:fixed;right:14px;bottom:14px;width:290px;height:430px;display:none;flex-direction:column;
    border:1px solid var(--faint);border-radius:16px;overflow:hidden;z-index:60;
    background:rgba(5,5,5,.92);backdrop-filter:blur(8px);box-shadow:0 20px 60px rgba(0,0,0,.7)}
  body.chat-open aside{display:flex}

  .avrow{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center}
  #reply{flex:1;overflow:auto;padding:8px 14px 10px;font-size:12px;line-height:1.55;color:var(--ink);
    white-space:pre-wrap;min-height:0}
  #reply .m{color:var(--dim);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;margin-top:12px}
  #reply .m:first-child{margin-top:0}

  /* chat dock with thinking orb (anark orb port: pulsing ring orb + input) */
  #chatdock{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--faint);
    background:#0b0b0b;align-items:center}
  .orb{width:30px;height:30px;border-radius:50%;flex:0 0 auto;position:relative;
    background:radial-gradient(circle at 35% 30%, rgba(201,107,94,.85), rgba(201,107,94,.15) 65%, transparent);
}

/* ==== magnetic cursor: exclusion-blend glass (magnetic-cursor port) ==== */
(function(){
  function initCur(){
  const el = document.getElementById('mcur'); if (!el) return;
  const pos={x:-100,y:-100,tx:-100,ty:-100,px:-100,py:-100};
  let hover=false, detaching=false, seen=false;
  const lerp=(a,b,t)=>a+(b-a)*t;
  function frame(){
    if (!hover){
      pos.x=lerp(pos.x,pos.tx,.18); pos.y=lerp(pos.y,pos.ty,.18);
      const dx=pos.x-pos.px, dy=pos.y-pos.py;
      pos.px=pos.x; pos.py=pos.y;
      const speed=Math.min(1, Math.hypot(dx,dy)*.02);
      if (detaching){ detaching=false;
        el.style.width='24px'; el.style.height='24px'; el.style.borderRadius='50%'; }
      el.style.transform=`translate(${pos.x-12}px,${pos.y-12}px)`+
        (speed>.01?` rotate(${Math.atan2(dy,dx)}deg) scale(${1+speed},${1-speed*.6})`:'');
    }
    requestAnimationFrame(frame);
  }
  frame();
  addEventListener('pointermove',e=>{
    pos.tx=e.clientX; pos.ty=e.clientY;
    if (!seen){ seen=true; pos.x=pos.tx; pos.y=pos.ty; pos.px=pos.tx; pos.py=pos.ty; el.style.opacity=1; }
    el.style.opacity = (e.clientX>=0&&e.clientX<=innerWidth&&e.clientY>=0&&e.clientY<=innerHeight)?1:0;
    const t=e.target.closest('[data-magnetic]');
    if (t && !hover){
      const r=t.getBoundingClientRect(), pad=12;
      hover=true;
      el.style.width=(r.width+pad*2)+'px'; el.style.height=(r.height+pad*2)+'px';
      el.style.borderRadius=getComputedStyle(t).borderRadius||'12px';
      el.style.transform=`translate(${r.left+r.width/2-r.width/2-pad}px,${r.top+r.height/2-r.height/2-pad}px)`;
    } else if (!t && hover){
      hover=false; detaching=true;
    }
  },{passive:true});
  document.addEventListener('mouseleave',()=>el.style.opacity=0);
  document.addEventListener('mouseenter',()=>el.style.opacity=1);
  }
  if (document.readyState==='loading') addEventListener('DOMContentLoaded', initCur); else initCur();
})();

/* ==== hyper-grid: perspective 3D grid + cursor parallax + warp on mouse speed ==== */
(function(){
  const cv = document.getElementById('hypergrid'), ctx = cv.getContext('2d');
  const host = cv.parentElement || document.body;
  let W, H;
  function fit(){ const r = host.getBoundingClientRect(); W = cv.width = Math.max(60, r.width); H = cv.height = Math.max(60, r.height); }
  fit(); addEventListener('resize', fit);
  let mx = .5, my = .5;
  addEventListener('mousemove', e => {
    mx = (e.clientX / innerWidth - .5) * 2;
    my = (e.clientY / innerHeight - .5) * 2;
  });
  function frame(){
    ctx.clearRect(0, 0, W, H);
    const gap = 26;
    const ox = ((mx * 10) % gap + gap) % gap, oy = ((my * 10) % gap + gap) % gap;
    for (let y = oy - gap/2; y < H + gap; y += gap){
      for (let x = ox - gap/2; x < W + gap; x += gap){
        // parallax drift by distance from center for subtle depth
        const dx = (x - W/2) / W, dy = (y - H/2) / H;
        const px = x - mx * 14 * (0.4 + Math.abs(dx)), py = y - my * 14 * (0.4 + Math.abs(dy));
        ctx.beginPath();
        ctx.arc(px, py, 1.1, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(127,214,164,.16)';
        ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ==== fused system ring chart (concentric port) ==== */
const SYS = [
  {key:'mem',  label:'mem',  max:100},
  {key:'dsk',  label:'dsk',  max:100},
  {key:'cpu',  label:'cpu',  max:100},
  {key:'ph',   label:'ph',   max:100},
];
(function(){
  const wrap = document.getElementById('sysrings');
  const SIZE=96, C=SIZE/2, svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('width',SIZE); svg.setAttribute('height',SIZE);
  svg.setAttribute('viewBox','0 0 '+SIZE+' '+SIZE);
  const rings=[];
  // outer→inner: mem, dsk, cpu, ph — concentric tracks
  for (let i=0;i<SYS.length;i++){
    const r = 42 - i*9;               // 42,33,24,15
    const sw = 8 - i*0.5;             // slightly thinner inward
    const circ=2*Math.PI*r;
    const bg=document.createElementNS(svgNS,'circle');
    bg.setAttribute('cx',C);bg.setAttribute('cy',C);bg.setAttribute('r',r);
    bg.setAttribute('fill','none');bg.setAttribute('stroke','rgba(127,214,164,.10)');bg.setAttribute('stroke-width',sw);
    const fg=document.createElementNS(svgNS,'circle');
    fg.setAttribute('cx',C);fg.setAttribute('cy',C);fg.setAttribute('r',r);
    fg.setAttribute('fill','none');
    fg.setAttribute('stroke', i===2 ? 'var(--bad)' : 'var(--ok)');
    fg.setAttribute('stroke-width',sw);
    fg.setAttribute('stroke-linecap','round');
    fg.setAttribute('stroke-dasharray',circ);
    fg.setAttribute('stroke-dashoffset',circ*(1-0.0));
    fg.setAttribute('transform','rotate(-90 '+C+' '+C+')');
    fg.style.transition='stroke-dashoffset .8s cubic-bezier(.3,1,.4,1)';
    svg.appendChild(bg); svg.appendChild(fg);
    rings.push({fg, circ});
  }
  wrap.appendChild(svg);
  window._sysSet = function(key,pct){
    const idx = SYS.findIndex(s=>s.key===key); if (idx<0) return;
    SYS[idx].val = pct;
    const p = Math.max(0, Math.min(100, pct))/100;
    rings[idx].fg.setAttribute('stroke-dashoffset', rings[idx].circ*(1-p));
    const leg = document.getElementById('syslegend');
    let li = leg.querySelector('[data-k="'+key+'"]');
    if (!li){
      li=document.createElement('div'); li.className='li'; li.dataset.k=key;
      li.innerHTML='<i></i><span>'+SYS[idx].label+'</span><b>–</b>';
      li.querySelector('i').style.background = (key==='cpu') ? getComputedStyle(document.documentElement).getPropertyValue('--bad') : getComputedStyle(document.documentElement).getPropertyValue('--ok');
      leg.appendChild(li);
    }
    li.querySelector('b').textContent = Math.round(pct)+'%';
  };
})();

/* ==== morphing thinking orb (ported: dotted canvas orb + label cycle + answer morph) ==== */
const MO = (() => {

  const ctx = cv.getContext('2d');
  // dots: 16 rings sphere
  const dots = [];
  const TAU = Math.PI * 2;
  for (let k = 0; k < 16; k++) {

    const m = Math.max(4, Math.round(30 * r));

  const lit = new Float32Array(dots.length);

    raf = 0;
    if (dead) return;
    const dt = Math.min(.05, (now - (frame.l || now)) / 1000); frame.l = now;
    t += dt; spin = .6; rot += spin * dt;
    ctx.clearRect(0,0,SZ,SZ);
    const cyw = Math.cos(rot), syw = Math.sin(rot);
    const CP = Math.cos(.35), SP = Math.sin(.35);
    const N = dots.length;
    for (let pass = 0; pass < 2; pass++){
      for (let n = 0; n < N; n++){
        const d = dots[n];
        const x1 = d.x * cyw + d.z * syw, z1 = -d.x * syw + d.z * cyw;
        const y2 = d.y * CP - z1 * SP, z2 = d.y * SP + z1 * CP;
        const f = 2.8 / (2.8 - z2), depth = (z2 + 1) / 2;
        // shimmer twinkle
        const tw = .55 + .25 * Math.sin(d.s + t * 1.6) + .4 * depth * depth;
        let a = tw * (alpha || 0);
        a = Math.min(1, a);
        if (a <= .01) continue;
        if ((depth >= .5) !== (pass === 1)) continue;
        const sx = SZ/2 + x1 * R * f, sy = SZ/2 - y2 * R * f;
        const rad = 1.4 * (.45 + .75 * depth) * f;
        // orange → cream blend by depth
        const mix = depth * .6 + .25 * Math.sin(d.s + t);
        ctx.fillStyle = `rgba(${232 + (241-232)*mix},${84 + (215-84)*mix},${4 + (200-4)*mix},${a.toFixed(3)})`;
        ctx.beginPath(); ctx.arc(sx, sy, rad, 0, TAU); ctx.fill();
      }
    }
    if (alpha > .002) raf = requestAnimationFrame(frame);
    else ctx.clearRect(0,0,SZ,SZ);
  }
  function ensure(){ if (!raf && !dead && alpha > .002){ frame.l = performance.now(); raf = requestAnimationFrame(frame); } }
  function show(){ alpha = 1; ensure(); }
  function hide(){ alpha = 0; }
  return {cv, show, hide, get alpha(){return alpha;}};
})();

fetch('/v3/events.json').then(r=>r.json()).then(x=>{
  const wk = document.getElementById('wkl'); if (!wk) return;
  const now = new Date();
  const in7 = new Date(now.getTime() + 7*864e5);
  const rows = (x.events||[]).filter(e => { const t=new Date(e.next); return t>=new Date(now-864e5) && t<=in7; })
    .sort((a,b)=>new Date(a.next)-new Date(b.next));
  wk.innerHTML = rows.length ? rows.map(e=>{
    const d=new Date(e.next);
    const day=d.toLocaleDateString('en-GB',{weekday:'short'});
    const tm=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
    return `<div class="wkd"><div class="nm">${esc(e.name)}</div><div class="when">${day} ${tm} · <b>${e.last_status==='ok'?'ok':e.last_status}</b></div></div>`;

/* ==== eco watt history bars (spring) ==== */
const ecoHist = [];
function drawEcoBars(){
  const el = document.getElementById('ecobars'); if (!el) return;
  const N = 14;
  while (ecoHist.length < N) ecoHist.unshift({in:0, out:0});
  el.innerHTML = ecoHist.map((h, i) =>
    `<i class="${i % 2 ? 'o' : ''}"></i>`).join('');
  [...el.children].forEach((b, idx) => {
    const h = ecoHist[idx] || {in:0, out:0};
    const v = idx % 2 ? h.out : h.in;
    const pct = Math.min(100, Math.max(3, (v / 500) * 100));
    setTimeout(() => { b.style.height = pct + '%'; }, idx * 40);
  });
}
const _origRefreshEco = refreshEco;
refreshEco = async function(){
  await _origRefreshEco.apply(this, arguments);
  try{
    const r = await fetch('/ecoflow'); const d = await r.json();
    if (d.ok){ ecoHist.push({in: Math.round(d.inW), out: Math.round(d.outW)}); drawEcoBars(); }
  }catch(e){}
}
